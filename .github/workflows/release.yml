# Release the module.
#
# Easiest: Actions tab -> Release -> Run workflow. It uses the version in module.json
# (or the one you type in), creates the v<version> tag and GitHub release, and attaches
# module.json + module.zip. Release notes come from that version's section in CHANGELOG.md.
#
# Publishing a release by hand on the Releases page also works; the files get attached the same way.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0. Leave blank to use the version in module.json."
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version and tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
            VERSION="${TAG#v}"
          else
            VERSION="${INPUT_VERSION:-$(jq -r .version module.json)}"
            VERSION="${VERSION#v}"
            TAG="v$VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists. Raise the version in module.json, or type a new version when running the workflow."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fill in version and links
        env:
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}"
          jq --arg v "$VERSION" --arg base "$BASE" --arg tag "$TAG" '
            .version   = $v |
            .url       = $base |
            .manifest  = ($base + "/releases/latest/download/module.json") |
            .download  = ($base + "/releases/download/" + $tag + "/module.zip") |
            .bugs      = ($base + "/issues") |
            .readme    = ($base + "/blob/main/README.md") |
            .changelog = ($base + "/blob/main/CHANGELOG.md")
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Version $VERSION" > notes.md
          cat notes.md

      - name: Zip the module
        # Everything Foundry needs, at the root of the zip
        run: zip -r module.zip module.json scripts styles README.md CHANGELOG.md LICENSE

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            module.json
            module.zip
