# Builds the module when you publish a GitHub Release.
# Tag the release like v1.2.3. The workflow writes that version, plus this repo's
# manifest/download/url links, into module.json, zips the module, and attaches
# module.json + module.zip to the release. Foundry/The Forge install from those files.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill in version and links
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}"
          jq --arg v "$VERSION" --arg base "$BASE" --arg tag "$TAG" '
            .version   = $v |
            .url       = $base |
            .manifest  = ($base + "/releases/latest/download/module.json") |
            .download  = ($base + "/releases/download/" + $tag + "/module.zip") |
            .bugs      = ($base + "/issues") |
            .readme    = ($base + "/blob/main/README.md") |
            .changelog = ($base + "/blob/main/CHANGELOG.md")
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Zip the module
        # Everything Foundry needs, at the root of the zip
        run: zip -r module.zip module.json scripts styles README.md CHANGELOG.md LICENSE

      - name: Attach files to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
